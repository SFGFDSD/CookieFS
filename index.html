<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>叠笺 · CookieFS 4 — 纯 Cookie 文件系统（单文件）</title>
<meta name="description" content="叠笺 CookieFS 4：仅用浏览器 Cookie 作为持久化存储的文件系统。LZMA + 字典 deflate 双编解码择优、base-93/90/85 自适应字符表、分路径冷热分层、奇偶校验页、预算治理、上一代同片数容量对比与新手术语模式。单文件，无外部依赖。">
<style>:root {
  --paper: #f6f2ea; --paper-2: #efe9dd; --paper-3: #e6dfd0; --ink: #1f1d1a; --ink-2: #4a463f; --ink-3: #85806f; --line: #d9d1c0;
  --accent: #b5482d; --accent-2: #d9714f; --seal: #9f2f22; --ok: #2f7d4f; --warn: #b7791f; --bad: #b3261e; --info: #2b5f9e;
  --hot: #d9714f; --meta: #2b5f9e; --sb: #6d4c9f; --free: #ece6d8; --parity: #9a8f6c;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  --radius: 10px; --shadow: 0 1px 2px rgba(31,29,26,.06), 0 8px 24px -12px rgba(31,29,26,.25);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); color: var(--ink); background: var(--paper); font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 11px; transition: background .12s, border-color .12s, transform .05s; }
button:hover { background: var(--paper-2); border-color: #c9bfa9; }
button:active { transform: translateY(1px); }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
button.primary:hover { background: #33302b; }
button.danger { color: var(--bad); border-color: #e2b9b6; }
button.danger:hover { background: #fbeeed; }
button.small { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
input[type=text], input[type=number], select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: #fff; }
input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus { outline: 2px solid rgba(181,72,45,.25); border-color: var(--accent-2); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; }
a { color: var(--info); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #d3cab7; border-radius: 6px; border: 2px solid var(--paper); }

/* ---------- top bar */
#top { display: flex; align-items: center; gap: 10px; padding: 7px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fbf8f2, var(--paper)); flex: 0 0 auto; }
#top .logo { display: flex; align-items: center; gap: 9px; }
#top .logo svg { width: 30px; height: 30px; }
#top .logo b { font-size: 18px; letter-spacing: 2px; }
#top .logo small { color: var(--ink-3); font-size: 11.5px; display: block; letter-spacing: .5px; margin-top: -2px; white-space: nowrap; }
#top .spacer { flex: 1; }
#status { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 11.5px; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.pill.warn .dot { background: var(--warn); } .pill.bad .dot { background: var(--bad); } .pill.dirty .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(181,72,45,.18); }
.pill b { font-weight: 600; }
#top .actions { display: flex; gap: 5px; } #top .actions button { white-space: nowrap; padding: 5px 9px; }

/* ---------- layout */
#main { flex: 1; display: grid; grid-template-columns: 260px minmax(320px, 1fr) minmax(420px, 46%); min-height: 0; }
#side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--paper-2); }
#center { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #fff; }
#right { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--paper); }
@media (max-width: 1100px) { #main { grid-template-columns: 220px 1fr; grid-template-rows: 1fr 46%; } #right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } }

/* ---------- side / tree */
#side header, #right header, #center header { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
#side header input { flex: 1; min-width: 0; padding: 3px 8px; font-size: 12.5px; }
#tree { flex: 1; overflow: auto; padding: 6px 4px; font-size: 13px; }
.node { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; user-select: none; }
.node:hover { background: rgba(31,29,26,.06); }
.node.sel { background: var(--ink); color: var(--paper); }
.node .ic { width: 14px; text-align: center; flex: 0 0 auto; font-size: 11px; color: var(--ink-3); }
.node.sel .ic { color: var(--paper-3); }
.node .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.node .sz { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.node.sel .sz { color: var(--paper-3); }
.node .loc { font-size: 9.5px; padding: 0 4px; border-radius: 4px; background: rgba(0,0,0,.06); font-family: var(--mono); }
.node .loc.H { background: rgba(217,113,79,.22); } .node .loc.X { background: rgba(43,95,158,.16); } .node .loc.D { background: rgba(181,72,45,.28); }
.node.dirty .nm::after { content: " •"; color: var(--accent); }
.node.dir .nm { font-weight: 600; }
.kids { margin-left: 14px; border-left: 1px dashed var(--line); padding-left: 2px; }
#side footer { border-top: 1px solid var(--line); padding: 6px 8px; display: flex; gap: 4px; flex-wrap: wrap; }
.empty { color: var(--ink-3); padding: 24px 14px; text-align: center; font-size: 13px; line-height: 1.7; }

/* ---------- editor */
#center header .path { font-family: var(--mono); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#editor { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#editor textarea { flex: 1; border: 0; border-radius: 0; resize: none; padding: 12px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.6; background: #fff; tab-size: 2; }
#editor textarea:focus { outline: none; }
#preview { flex: 1; overflow: auto; padding: 16px; display: none; }
#preview img { max-width: 100%; border: 1px solid var(--line); background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px; }
#preview pre { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-all; color: var(--ink-2); }
#fileinfo { border-top: 1px solid var(--line); padding: 5px 12px; font-size: 11.5px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); background: var(--paper-2); }

/* ---------- right: tabs */
#tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: 0 0 auto; }
#tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; border-radius: 8px 8px 0 0; padding: 5px 11px; font-size: 12.5px; color: var(--ink-2); }
#tabs button.on { background: #fff; border-color: var(--line); color: var(--ink); font-weight: 600; margin-bottom: -1px; }
#panels { flex: 1; overflow: auto; padding: 12px; min-height: 0; }
.panel { display: none; } .panel.on { display: block; }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 8px; font-size: 13.5px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.card h3 small { font-weight: normal; color: var(--ink-3); font-size: 11.5px; }
.card h3 .right { margin-left: auto; display: flex; gap: 6px; }
.hint { color: var(--ink-3); font-size: 11.5px; line-height: 1.6; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper-2); }
.kpi .v { font-size: 20px; font-weight: 700; font-family: var(--mono); letter-spacing: -.5px; }
.kpi .l { font-size: 11px; color: var(--ink-3); }
.kpi .s { font-size: 11px; color: var(--ink-2); font-family: var(--mono); }

/* gauges */
.gauge { margin: 6px 0 10px; }
.gauge .lbl { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
.gauge .lbl b { font-family: var(--mono); font-weight: 500; }
.gauge .bar { height: 12px; border-radius: 6px; background: var(--free); overflow: hidden; position: relative; border: 1px solid #e2dbcb; }
.gauge .bar i { position: absolute; left: 0; top: 0; bottom: 0; }
.gauge .bar i.ours { background: linear-gradient(90deg, var(--info), #5f8fcf); }
.gauge .bar i.hot { background: var(--hot); } .gauge .bar i.meta { background: var(--meta); } .gauge .bar i.sb { background: var(--sb); } .gauge .bar i.foreign { background: repeating-linear-gradient(135deg, #c8bfa8 0 4px, #ddd5c2 4px 8px); }
.gauge .bar i.mark { width: 2px; background: var(--seal); }
.gauge.over .bar { border-color: var(--bad); }

/* jar map */
.jar { margin-bottom: 10px; }
.jar .t { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 4px; }
.jar .t b { font-family: var(--mono); }
.jar .t .path { color: var(--ink-3); font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; }
.slot { aspect-ratio: 1; border-radius: 3px; background: var(--free); border: 1px solid rgba(0,0,0,.05); position: relative; font-size: 7px; display: flex; align-items: flex-end; justify-content: center; color: rgba(0,0,0,.5); overflow: hidden; }
.slot.M { background: var(--meta); color: #fff; } .slot.H { background: var(--hot); color: #fff; } .slot.S { background: var(--sb); color: #fff; }
.slot.X { color: #fff; } .slot.P::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent 0 3px, rgba(255,255,255,.55) 3px 5px); }
.slot.dim { opacity: .45; } .slot.ghost { border-style: dashed; border-color: #b9ae94; background: transparent; }
.slot .f { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.18); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }

/* waterfall */
.wf { display: grid; grid-template-columns: 110px 1fr 90px; gap: 4px 10px; align-items: center; font-size: 12px; }
.wf .b { height: 16px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); min-width: 2px; position: relative; }
.wf .b.alt { background: linear-gradient(90deg, #6f8fb8, #9db8d9); }
.wf .n { font-family: var(--mono); text-align: right; }
.wf .l { color: var(--ink-2); }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-weight: 600; color: var(--ink-2); font-size: 11px; letter-spacing: .3px; background: var(--paper-2); position: sticky; top: 0; }
td.n, th.n { text-align: right; font-family: var(--mono); }
.ratio { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: #e6e0d2; overflow: hidden; vertical-align: middle; }
.ratio i { display: block; height: 100%; background: var(--ok); } .ratio i.dead { background: var(--bad); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 10.5px; font-family: var(--mono); background: var(--paper-3); }
.tag.H { background: rgba(217,113,79,.25); } .tag.D { background: rgba(43,95,158,.18); } .tag.b { background: rgba(47,125,79,.18); }

/* timeline */
.tl { font-size: 12px; }
.tl .row { display: grid; grid-template-columns: 44px 70px 1fr 60px; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.tl .bars { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--free); }
.tl .bars i { display: block; height: 100%; }
.tl .bars .c1 { background: #d9714f; } .tl .bars .c2 { background: #2b5f9e; } .tl .bars .c3 { background: #6d4c9f; } .tl .bars .c4 { background: #2f7d4f; }

/* log */
#log { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-all; max-height: 100%; }
#log .warn { color: var(--warn); } #log .error { color: var(--bad); } #log .t { color: var(--ink-3); }

/* lab */
.lab-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.lab-row label { font-size: 12px; color: var(--ink-2); }
.lab-row input[type=number] { width: 80px; }
.result { background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; margin-top: 6px; max-height: 260px; overflow: auto; }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(31,29,26,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
#modal.on { display: flex; }
#modal .box { background: var(--paper); border-radius: 14px; width: min(720px, 94vw); max-height: 88vh; overflow: auto; padding: 18px 20px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
#modal h2 { margin: 0 0 10px; font-size: 16px; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
.form label span.d { font-size: 11px; color: var(--ink-3); }
.form label.wide { grid-column: 1 / -1; }
.form label.row { flex-direction: row; align-items: center; gap: 8px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* toasts */
#toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 60; }
.toast { background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 8px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 420px; animation: pop .18s ease-out; }
.toast.bad { background: var(--bad); } .toast.ok { background: var(--ok); } .toast.warn { background: var(--warn); }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

#banner { display: none; background: #fdf1e6; border-bottom: 1px solid #f0cfae; color: #7a4a12; padding: 6px 14px; font-size: 12.5px; }
#banner.on { display: block; }
.drop { outline: 3px dashed var(--accent-2); outline-offset: -6px; }

/* ======================================================= v4 additions */
:root { --v4: #2b5f9e; --v3: #b08a3a; --yj: #9a2f6a; --easy: #2f7d4f; }
[data-theme=dark] { --paper: #1b1a18; --paper-2: #23211e; --paper-3: #2c2925; --ink: #ece6d8; --ink-2: #c9c1b0; --ink-3: #8f887a; --line: #3a3630; --free: #2a2723; --shadow: 0 1px 2px rgba(0,0,0,.4); }
[data-theme=dark] body { background: var(--paper); }
[data-theme=dark] button, [data-theme=dark] input[type=text], [data-theme=dark] input[type=number], [data-theme=dark] select, [data-theme=dark] textarea, [data-theme=dark] .card, [data-theme=dark] .pill, [data-theme=dark] #center, [data-theme=dark] #editor textarea, [data-theme=dark] #tabs button.on, [data-theme=dark] kbd { background: var(--paper-2); color: var(--ink); }
[data-theme=dark] #top { background: linear-gradient(180deg, #23211e, #1b1a18); }
[data-theme=dark] button:hover { background: var(--paper-3); }
[data-theme=dark] button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
[data-theme=dark] .node.sel { background: var(--accent); color: #fff; }
[data-theme=dark] th { background: var(--paper-3); }
[data-theme=dark] .kpi, [data-theme=dark] .result, [data-theme=dark] #fileinfo { background: var(--paper-3); }
[data-theme=dark] .slot { border-color: rgba(255,255,255,.06); }
[data-theme=dark] #modal .box { background: var(--paper-2); }
[data-theme=dark] .preset { background: var(--paper-3); }
[data-theme=dark] #preview img { background: repeating-conic-gradient(#333 0 25%, #222 0 50%) 0 0/16px 16px; }
/* easy-mode explanations */
.explain { display: none; color: var(--easy); font-size: 11.5px; line-height: 1.6; margin: -2px 0 8px; padding: 6px 9px; border-left: 3px solid var(--easy); background: rgba(47,125,79,.07); border-radius: 0 6px 6px 0; }
[data-mode=easy] .explain { display: block; }
[data-mode=easy] .pro-only { display: none !important; }
.term { border-bottom: 1px dotted var(--ink-3); cursor: help; }
#mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 11.5px; }
#mode-toggle button { border: 0; border-radius: 0; padding: 3px 9px; background: transparent; color: var(--ink-2); }
#mode-toggle button.on { background: var(--easy); color: #fff; }
#mode-toggle button.on.pro { background: var(--ink); }
[data-theme=dark] #mode-toggle button.on.pro { background: var(--accent); }
/* meter (cookie count) */
.meter { position: relative; height: 18px; border-radius: 9px; background: var(--free); border: 1px solid #e2dbcb; overflow: visible; margin: 14px 0 18px; }
.meter i { position: absolute; top: 0; bottom: 0; }
.meter i.ours { background: linear-gradient(90deg, var(--info), #5f8fcf); border-radius: 9px 0 0 9px; }
.meter i.foreign { background: repeating-linear-gradient(135deg, #c8bfa8 0 4px, #ddd5c2 4px 8px); }
.meter i.pending { background: repeating-linear-gradient(135deg, rgba(217,113,79,.7) 0 4px, rgba(217,113,79,.35) 4px 8px); }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-3); }
.meter .tick.cap { background: var(--warn); }
.meter .tick.peak { background: var(--accent); }
.meter .tick.purge { background: var(--bad); }
.meter .tick span { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; color: var(--ink-2); font-family: var(--mono); margin-top: 2px; }
.meter .tick.up span { top: auto; bottom: 100%; margin: 0 0 2px; }
/* chart */
.chart { width: 100%; height: auto; display: block; font-family: var(--mono); }
.chart text { font-size: 10px; fill: var(--ink-2); }
.chart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.chart .axis { stroke: var(--ink-3); }
.chart polyline { fill: none; stroke-width: 2; stroke-linejoin: round; }
.chart .dot { stroke: #fff; stroke-width: 1; }
/* indicator strip */
.ind { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
.ind .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-size: 11.5px; background: var(--paper-2); }
.ind .chip b { font-family: var(--mono); font-weight: 600; }
.ind .chip.good { border-color: rgba(47,125,79,.5); }
.ind .chip.warn { border-color: rgba(201,140,42,.7); }
/* settings */
#modal .box.wide { width: min(980px, 96vw); max-height: 92vh; }
.sgroups { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
@media (max-width: 800px) { .sgroups { grid-template-columns: 1fr; } }
.sgroup { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.sgroup h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.sgroup h4 small { color: var(--ink-3); font-weight: normal; }
.srow { display: grid; grid-template-columns: 1fr 118px; gap: 2px 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .lbl { font-size: 12px; }
.srow .lbl .d { display: block; color: var(--ink-3); font-size: 11px; line-height: 1.4; }
.srow .lbl .risk { color: var(--bad); }
.srow input[type=number], .srow select { width: 118px; padding: 3px 6px; font-size: 12px; }
.srow .chg { color: var(--accent); font-weight: 600; }
.srow .def { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); grid-column: 1 / -1; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
.preset { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; cursor: pointer; background: var(--paper-2); font-size: 12px; max-width: 220px; }
.preset:hover { border-color: var(--accent-2); }
.preset b { display: block; font-size: 12.5px; }
.preset span { color: var(--ink-3); font-size: 11px; line-height: 1.35; display: block; }
.preset.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(181,72,45,.15); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
/* glossary */
.gloss { display: grid; grid-template-columns: 150px 150px 1fr; gap: 4px 10px; font-size: 12px; align-items: start; }
.gloss .p { font-family: var(--mono); font-weight: 600; }
.gloss .e { color: var(--easy); font-weight: 600; }
.gloss .x { color: var(--ink-2); }
.gloss .hd { color: var(--ink-3); font-size: 11px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
/* comparison bars */
.cbar { display: grid; grid-template-columns: 200px 1fr 130px; gap: 4px 10px; align-items: center; font-size: 12px; }
.cbar .b { height: 16px; border-radius: 4px; min-width: 2px; position: relative; }
.cbar .b.v4 { background: linear-gradient(90deg, var(--v4), #5f8fcf); }
.cbar .b.v3 { background: linear-gradient(90deg, var(--v3), #d2b26a); }
.cbar .b.yj { background: linear-gradient(90deg, var(--yj), #c96b9c); }
.cbar .b.v2 { background: linear-gradient(90deg, #6f8fb8, #9db8d9); }
.cbar .n { font-family: var(--mono); text-align: right; }
.win { color: var(--ok); font-weight: 600; }
.lose { color: var(--bad); font-weight: 600; }
.progress { height: 6px; border-radius: 3px; background: var(--free); overflow: hidden; margin-top: 6px; }
.progress i { display: block; height: 100%; background: var(--accent-2); transition: width .2s; }
.tag.L { background: rgba(109,76,159,.2); }
.tag.a93 { background: rgba(47,125,79,.18); }
.tag.a90 { background: rgba(201,140,42,.2); }
.tag.a85 { background: rgba(0,0,0,.08); }
.slot.PR { background: #7a7a7a; color: #fff; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { font-size: 26px; font-weight: 700; font-family: var(--mono); }
.sub { font-size: 11px; color: var(--ink-3); }
.note { font-size: 11.5px; color: var(--ink-2); line-height: 1.6; }
#banner:empty { display: none; }
</style>
</head>
<body data-mode="pro" data-theme="light">
<div id="banner"></div>
<div id="top">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="12" width="20" height="18" rx="2" fill="#d8cfbd" stroke="#1f1d1a" stroke-width="1.2"/><rect x="5" y="8" width="20" height="18" rx="2" fill="#e6dfd0" stroke="#1f1d1a" stroke-width="1.2"/><rect x="8" y="4" width="20" height="18" rx="2" fill="#f6f2ea" stroke="#1f1d1a" stroke-width="1.2"/><rect x="11" y="1" width="20" height="18" rx="2" fill="#fff" stroke="#1f1d1a" stroke-width="1.2"/><path d="M15 7h12M15 11h12M15 15h7" stroke="#b5482d" stroke-width="1.4" stroke-linecap="round"/></svg>
    <div><b>叠笺</b><small>CookieFS 4 · 纯 Cookie 文件系统</small></div>
  </div>
  <div id="status"></div>
  <div class="spacer"></div>
  <div id="mode-toggle" title="切换全系统的用语：专业术语 / 新手友好说法"><button data-mode="pro" class="pro on">专业</button><button data-mode="easy">新手</button></div>
  <div class="actions">
    <button id="btn-new" data-t="btn.new">新建</button>
    <button id="btn-import" data-t="btn.import">导入…</button>
    <button id="btn-export" data-t="btn.export">导出 ZIP</button>
    <button id="btn-settings" data-t="btn.settings">设置</button>
    <button id="btn-commit" class="primary" data-t="btn.commit">提交 (⌘/Ctrl+S)</button>
  </div>
</div>
<div id="main">
  <aside id="side">
    <header><input id="filter" type="text" placeholder="筛选文件…"><button class="small" id="btn-newdir" title="新建文件夹">＋目录</button></header>
    <div id="tree"></div>
    <footer>
      <button class="small" id="btn-rename">重命名</button>
      <button class="small danger" id="btn-delete">删除</button>
      <button class="small" id="btn-download">下载</button>
      <label class="small" style="margin-left:auto;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px"><input type="checkbox" id="autocommit" checked> <span data-t="ui.autocommit">自动提交</span></label>
    </footer>
  </aside>
  <section id="center">
    <header><span class="path" id="cur-path">未选择文件</span><span id="cur-badge"></span></header>
    <div id="editor"><textarea id="ta" spellcheck="false" placeholder="从左侧选择文件，或点击「新建」。拖拽文件 / ZIP 到窗口即可导入。"></textarea><div id="preview"></div></div>
    <div id="fileinfo"></div>
  </section>
  <section id="right">
    <div id="tabs">
      <button data-tab="dash" class="on" data-t="tab.dash">仪表盘</button>
      <button data-tab="cap" data-t="tab.cap">容量</button>
      <button data-tab="cmp" data-t="tab.cmp">对比 v3</button>
      <button data-tab="jar" data-t="tab.jar">罐位图</button>
      <button data-tab="comp" data-t="tab.comp">压缩</button>
      <button data-tab="ext" data-t="tab.ext">区块</button>
      <button data-tab="hist" data-t="tab.hist">提交历史</button>
      <button data-tab="env" data-t="tab.env">环境</button>
      <button data-tab="lab" data-t="tab.lab">实验室</button>
      <button data-tab="gloss" data-t="tab.gloss">术语表</button>
      <button data-tab="log" data-t="tab.log">日志</button>
    </div>
    <div id="panels">
      <div class="panel on" id="p-dash"></div>
      <div class="panel" id="p-cap"></div>
      <div class="panel" id="p-cmp"></div>
      <div class="panel" id="p-jar"></div>
      <div class="panel" id="p-comp"></div>
      <div class="panel" id="p-ext"></div>
      <div class="panel" id="p-hist"></div>
      <div class="panel" id="p-env"></div>
      <div class="panel" id="p-lab"></div>
      <div class="panel" id="p-gloss"></div>
      <div class="panel" id="p-log"><div id="log"></div></div>
    </div>
  </section>
</div>

    { g: 'layout', k: 'mergeFanIn', t: 'int', min: 2, max: 12, l: ['合并扇入', '攒几个小包再合'], d: ['tiered 策略：多少个小区块堆积后触发合并', '数字越大保存越快、包越多'] },
    { g: 'layout', k: 'deadRatio', t: 'float', min: 0.05, max: 0.95, step: 0.05, l: ['整理阈值（死数据比例）', '瘦身阈值'], d: ['区块中已删除/已覆盖内容占比 ≥ 此值时纳入下一次合并/整理', '删掉的内容占多少时重新打包'] },
    { g: 'safe', k: 'parity', t: 'bool', l: ['启用奇偶校验页', '启用备份页'], d: ['≥ parityMin 页的段附带 1 页校验，可无损重建任意 1 个丢失页', '每包多写一页，丢一页也能算回来（强烈建议开启）'], risk: v => !v },
    { g: 'safe', k: 'parityMin', t: 'int', min: 2, max: 40, l: ['校验起始页数', '多大的包才配备份页'], d: ['开销 ≤ 1/N；默认 4（≤ 25%），大区块实际 ≈ 8%', '默认 4'] },
    { g: 'safe', k: 'verifyCold', t: 'bool', l: ['冷页写后重新挂载校验', '归档写完后回读核对'], d: ['多一次 iframe 挂载（~20–100 ms），确认浏览器真的保存了', '推荐开启'] },
    { g: 'safe', k: 'autoRebuild', t: 'bool', l: ['自动重建目录', '自动修复目录'], d: ['superblock/META 全部失效时自动扫描全部段重建', '推荐开启'] },
    { g: 'safe', k: 'prevSuperblock', t: 'bool', l: ['保留上一代 superblock (T)', '保留上一代入口索引'], d: ['多占 1 条 cookie；S 损坏时可回退到上一代目录', '关掉能多存 1 条 cookie 的数据，但少一层保险'] },
    { g: 'cookie', k: 'priority', t: 'enum', o: ['High', 'Medium', 'Low'], l: ['Cookie 优先级', 'Cookie 优先级'], d: ['Chromium 淘汰顺序 Low → Medium → High', '保持 High'] },
    { g: 'cookie', k: 'sameSite', t: 'enum', o: ['Lax', 'Strict', 'None'], l: ['SameSite', 'SameSite'], d: ['None 需要 https + Secure', '保持 Lax'] },
    { g: 'cookie', k: 'maxAgeDays', t: 'int', min: 1, max: 400, l: ['Max-Age（天）', '有效期（天）'], d: ['Chrome/Firefox 上限 400 天；Safari/Brave 对 JS cookie 强制 7 天（靠重签续命）', '最长 400 天'] },
    { g: 'cookie', k: 'rearmDays', t: 'int', min: 1, max: 30, l: ['全量重签周期（天）', '全部续期周期（天）'], d: ['多久重写一次所有冷银行以刷新有效期（每次打开都会重签 bank 0）', '多久把所有 cookie 重新写一遍续期'] },
  ];
  const GROUPS = { cap: ['容量与预算', '空间与上限'], comp: ['压缩与编码', '压缩'], layout: ['布局与分层', '存放与归档'], safe: ['安全与恢复', '保护与修复'], cookie: ['Cookie 属性', 'Cookie 属性'] };
  const PRESETS = [
    { n: ['默认 · 极限容量', '默认（最能装）'], d: ['LZMA + 字典 deflate 择优、base-93、6 银行、tiered 合并、校验页开', '推荐；空间最省，保存稍慢'], v: {} },
    { n: ['极速', '最快'], d: ['HOT/META 只用 deflate、LZMA 仅用于 ≥16 KB 的区块、fan-in 6', '保存快很多，空间略多用 5–10%'], v: { lzmaHot: false, lzmaMin: 16384, mergeFanIn: 6, flushPages: 3 } },
    { n: ['最小首屏', '打开最快'], d: ['minimal 布局：bank 0 只留 superblock（≈70 B），META/HOT 也放冷银行', '每次打开页面几乎不带 cookie'], v: { layout: 'minimal', hotBudget: 12 * KB } },
    { n: ['极限条数', '压榨条数（有风险）'], d: ['siteCap 168 / peak 178、不保留 T、parityMin 6、8 银行 → 同样文件多出 ~12% 条数', '多存约 12%，但别的程序狂写 cookie 时可能被浏览器淘汰'], v: { siteCap: 168, sitePeak: 178, prevSuperblock: false, parityMin: 6, banks: 8 }, risk: true },
    { n: ['GitHub Pages', 'GitHub Pages'], d: ['hostCeiling 126 KiB、bankBudget 96 KiB、hotBudget 40 KiB（实测 128 KiB → 502）', '按 GitHub Pages 实测上限设置'], v: { hostCeiling: 126 * KB, bankBudget: 96 * KB, hotBudget: 40 * KB } },
    { n: ['小头部主机 (8 KB)', '服务器很严格 (8 KB)'], d: ['nginx/Apache 默认：hostCeiling 7.5 KB、每银行 1 页、35 银行、minimal、flushPages 1', '每个抽屉只能放一条 cookie，用 35 个抽屉'], v: { hostCeiling: 7680, bankBudget: 4300, hotBudget: 3000, banks: 35, layout: 'minimal', flushPages: 1 } },
    { n: ['v3 兼容行为', '和上一版一样'], d: ['4 银行、只用字典 deflate、Z85、eager 合并、fast 布局（用于对照）', '只是为了对照'], v: { banks: 4, codecPolicy: 'deflate', alphabet: '85', mergePolicy: 'eager', lzmaHot: false, layout: 'fast' } },
  ];
  $('#btn-settings').onclick = openSettings;
  function openSettings() {
    const box = $('#modal-box'); box.innerHTML = ''; box.classList.add('wide'); const defs = CookieFS4.defaults; const curVals = {}; for (const s of SCHEMA) curVals[s.k] = fs[s.k];
    const inputs = {};
    const fmtV = (s, v) => s.t === 'bytes' ? (v % KB === 0 ? v / KB + ' KiB' : v + ' B') : String(v);
    const rowFor = s => {
      let inp; const v = curVals[s.k];
      if (s.t === 'bool') inp = h('input', { type: 'checkbox', checked: !!v });
      else if (s.t === 'enum') inp = h('select', null, ...s.o.map(o => h('option', { value: o, selected: v === o }, o)));
      else inp = h('input', { type: 'number', value: s.t === 'bytes' ? Math.round(v) : v, min: s.min, max: s.max, step: s.step || 1 });
      inputs[s.k] = inp; const chg = h('span', { class: 'chg' }); const def = h('span', { class: 'def' }, `默认 ${fmtV(s, defs[s.k])}${s.t === 'bytes' ? '（字节）' : ''}`);
      const upd = () => { const nv = readVal(s); chg.textContent = nv !== defs[s.k] ? ' ●' : ''; def.style.color = nv !== defs[s.k] ? 'var(--accent)' : ''; def.classList.toggle('risk', !!(s.risk && s.risk(nv))); };
      inp.addEventListener('input', upd); inp.addEventListener('change', upd); setTimeout(upd, 0);
      return h('div', { class: 'srow' }, h('div', { class: 'lbl' }, S(s.l[0], s.l[1]), chg, h('span', { class: 'd' + (s.risk && s.risk(v) ? ' risk' : '') }, S(s.d[0], s.d[1]))), inp, def);
    };
    const readVal = s => { const i = inputs[s.k]; if (s.t === 'bool') return i.checked; if (s.t === 'enum') return i.value; const n = s.t === 'float' ? parseFloat(i.value) : parseInt(i.value, 10); return isNaN(n) ? curVals[s.k] : Math.max(s.min, Math.min(s.max, n)); };
    const setVals = vals => { for (const s of SCHEMA) { const v = s.k in vals ? vals[s.k] : defs[s.k]; const i = inputs[s.k]; if (s.t === 'bool') i.checked = !!v; else i.value = v; i.dispatchEvent(new Event('change')); } };
    const groups = h('div', { class: 'sgroups' });
    for (const [g, [lp, le]] of Object.entries(GROUPS)) groups.append(h('div', { class: 'sgroup' }, h('h4', null, S(lp, le)), ...SCHEMA.filter(s => s.g === g).map(rowFor)));
    const ui = h('div', { class: 'sgroup' }, h('h4', null, '界面', h('small', null, S('保存在 cookie cf4P（bank 0，约 60 B）', '界面偏好也存在一条很小的 cookie 里'))),
      h('div', { class: 'srow' }, h('div', { class: 'lbl' }, '用语模式', h('span', { class: 'd' }, S('专业术语 / 新手说法（右上角也可切换）', '专业术语 / 新手说法'))), h('select', { id: 'ui-mode' }, h('option', { value: 'pro', selected: prefs.mode === 'pro' }, '专业'), h('option', { value: 'easy', selected: prefs.mode === 'easy' }, '新手'))),
      h('div', { class: 'srow' }, h('div', { class: 'lbl' }, '主题'), h('select', { id: 'ui-theme' }, h('option', { value: 'light', selected: prefs.theme === 'light' }, '纸色'), h('option', { value: 'dark', selected: prefs.theme === 'dark' }, '暗色'))),
      h('div', { class: 'srow' }, h('div', { class: 'lbl' }, S('自动提交延迟 (ms)', '自动保存延迟 (ms)'), h('span', { class: 'd' }, S('最后一次编辑后多久自动提交', '停止输入多久后自动保存'))), h('input', { type: 'number', id: 'ui-delay', value: prefs.delay, min: 300, max: 60000, step: 100 })),
      h('div', { class: 'srow' }, h('div', { class: 'lbl' }, '删除前确认'), h('input', { type: 'checkbox', id: 'ui-confirm', checked: !!prefs.confirm })));
    groups.append(ui);
    const presets = h('div', { class: 'presets' }, ...PRESETS.map(p => h('div', { class: 'preset' + (p.risk ? ' risk' : ''), onclick: e => { setVals(p.v); document.querySelectorAll('.preset').forEach(x => x.classList.toggle('on', x === e.currentTarget)); } }, h('b', null, S(p.n[0], p.n[1]) + (p.risk ? ' ⚠' : '')), h('span', null, S(p.d[0], p.d[1])))));
    box.append(h('h2', null, `设置 · ${S('每一个可调项', '所有能调的都在这里')}`, h('small', { style: 'font-weight:normal;color:var(--ink-3);margin-left:8px' }, S('设置随下一次提交写入 META（与存储一起持久化）；● = 与默认不同；红字 = 有风险', '改完点「保存并提交」才生效；● 表示改过；红字表示有风险'))),
      X('不知道怎么调？先点一个预设，再微调。任何设置都不会让系统越过服务器/浏览器的硬限制——它只会在快到上限时拒绝保存并告诉你原因。'),
      h('div', { class: 'hint', style: 'margin:4px 0' }, S('预设（点击填入，仍需保存）：', '预设（点一下就填好，再点保存）：')), presets, groups,
      h('div', { class: 'modal-actions' },
        h('button', { class: 'danger', onclick: async () => { if (!confirm(S('销毁全部数据？将删除所有银行中的本系统 cookie。', '真的要删除全部数据吗？'))) return; fs.destroy(); closeModal(); cur = null; $('#ta').value = ''; $('#cur-path').textContent = '未选择文件'; await boot(); toast('已销毁', 'warn'); } }, S('销毁全部数据', '删除全部数据')),
        h('button', { onclick: async () => { closeModal(); try { await fs.rearmAll(); toast(S('已重签全部银行', '已全部续期'), 'ok'); } catch (e) { toast(e.message, 'bad'); } } }, S('全部重签 Max-Age', '全部续期')),
        h('button', { onclick: async () => { const img = await fs.exportImage(); download('叠笺-镜像-' + new Date().toISOString().slice(0, 10) + '.json', TE.encode(JSON.stringify(img)), 'application/json'); } }, S('导出 JSON 镜像', '导出备份 (JSON)')),
        h('button', { onclick: () => { closeModal(); $('#file-input').click(); } }, S('导入镜像 / 文件…', '导入备份…')),
        h('span', { style: 'flex:1' }),
        h('button', { onclick: closeModal }, '取消'),
        h('button', { class: 'primary', onclick: async () => {
          const changed = [];
          for (const s of SCHEMA) { const nv = readVal(s); if (nv !== fs[s.k]) { fs[s.k] = nv; changed.push(s.k); } }
          if (changed.includes('banks')) fs.banks = Math.max(1, Math.min(U.MAX_BANKS, fs.banks));
          prefs.mode = $('#ui-mode').value; prefs.theme = $('#ui-theme').value; prefs.delay = Math.max(300, +$('#ui-delay').value || 1400); prefs.confirm = $('#ui-confirm').checked ? 1 : 0; savePrefs(); applyTerms();
          closeModal();
          if (changed.length) { fs._pending = true; log('settings changed: ' + changed.join(', ')); await commit('settings'); }
          refreshAll(); renderEnv(); renderGloss(); $('#p-lab').dataset.ready = ''; if ($('#p-lab').classList.contains('on')) renderLab();
        } }, S('保存并提交', '保存'))));
    $('#modal').classList.add('on');
  }
  function closeModal() { $('#modal').classList.remove('on'); }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  /* ------------------------------------------------------------ go */
  boot().then(() => { log(`叠笺 CookieFS4 v${CookieFS4.VERSION} 就绪：${fs.files.size} 文件，gen ${fs.gen}，字符表 base-${fs.alphabetId}，布局 ${fs.effectiveLayout}`); const tab = document.querySelector(`#tabs button[data-tab="${prefs.tab}"]`); if (tab && prefs.tab !== 'dash') tab.click(); });
  window.fs = () => fs; window.CFS4_APP = { boot, refreshAll, openFile, commit, history, logLines, prefs, T, runReplay, openSettings };
})();
</script>
